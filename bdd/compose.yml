version: '3.8'

services:
  postgres:
    image: postgres:16.13-trixie
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: apiculteur
      POSTGRES_PASSWORD: nous-aimons-les-abeilles
      POSTGRES_DB: api-culteur
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
